<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Everything Is Going To Be Alright</title><style>:root{--bg:#fff7fa;--card:#fff;--text:#3a2830;--accent:#e86f92;--muted:#866d77;--border:#efd9e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}header{padding:20px 16px;background:linear-gradient(135deg,#ffd4df,#ffe1bf)}h1{font-size:21px;margin:0}header p{margin:5px 0}.nav{display:flex;gap:7px;padding:9px;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}button{font:inherit;font-weight:700;min-height:44px;border:0;border-radius:12px;padding:10px 14px;touch-action:manipulation}.nav button{border-radius:22px;background:#fce9ef;color:#6d3d4e;white-space:nowrap}.nav button.active,.primary{background:var(--accent);color:white}.secondary{background:#fce9ef;color:#6d3d4e}.danger{background:#ffe5e9;color:#9b3347}.page{display:none;padding:14px;max-width:900px;margin:auto}.page.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:12px}input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #e2cbd4;border-radius:10px;font:inherit;background:var(--card);color:var(--text)}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.alter{display:flex;gap:12px;align-items:center}.avatar{width:64px;height:64px;object-fit:cover;border-radius:50%;background:#f6dce4;flex:none}.square{border-radius:10px}.diamond{border-radius:10px;transform:rotate(45deg);margin:8px}.info{flex:1;min-width:0}.small{font-size:13px;color:var(--muted)}.history{padding:9px 0;border-bottom:1px solid var(--border)}audio{width:100%;margin-top:7px}.tag{display:inline-block;padding:5px 9px;background:#fce9ef;border-radius:99px;margin:3px;font-size:12px}.profileHero{min-height:150px;border-radius:16px;padding:18px;background-size:cover;background-position:center;margin-bottom:12px}.profileAvatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#f6dce4}.private{opacity:.9}.item{padding:10px;background:#fff7fa;border-radius:12px;margin:7px 0}</style></head><body><header><h1>Everything Is Going To Be Alright</h1><p>Your private alter tracker.</p></header><div class="nav" id="nav"><button data-page="home" class="active">Home</button><button data-page="alters">Alters</button><button data-page="front">Front</button><button data-page="mood">Mood</button><button data-page="journal">Journal</button><button data-page="settings">Settings</button></div><main><section id="home" class="page active"><div class="card"><h2>Welcome 💗</h2><p>Everything is going to be alright.</p><div class="row"><button class="primary" data-go="alters">Manage Alters</button><button class="primary" data-go="front">Fronting</button></div></div><div class="card"><h3>Current Front</h3><div id="homeFront">None</div></div><div class="card"><h3>Quick Note</h3><textarea id="quick" rows="4" placeholder="Write something..."></textarea><button class="primary" id="saveQuick">Save Note</button></div></section><section id="alters" class="page"><div class="card"><h2>Alters</h2><input id="search" placeholder="Search alters"><div id="alterList"></div></div><div class="card"><h3>Add Alter</h3><input id="aname" placeholder="Name"><input id="apr" placeholder="Pronouns"><input id="aimg" placeholder="Avatar image URL"><input id="abg" placeholder="Background image URL"><select id="ashape"><option value="circle">Circle</option><option value="square">Square</option><option value="diamond">Diamond</option></select><input id="acolor" type="color" value="#e86f92"><select id="astatus"><option>Active</option><option>Inactive</option><option>Dormant</option></select><textarea id="abio" placeholder="Bio"></textarea><input id="asong" placeholder="Profile song URL"><input id="agroup" placeholder="Group (optional)"><label><input id="aprivate" type="checkbox" style="width:auto"> Private profile</label><button class="primary" id="addAlter">Add Alter</button></div><div id="editor"></div></section><section id="profile" class="page"><div id="profileContent"></div></section><section id="front" class="page"><div class="card"><h2>Fronting</h2><select id="frontSelect"></select><select id="frontState"><option>Front</option><option>Co-conscious</option><option>Lurking</option><option>Not Fronting</option></select><button class="primary" id="setFront">Update Fronting</button><h3>Current</h3><div id="frontNow"></div><h3>History</h3><div id="frontHistory"></div></div></section><section id="mood" class="page"><div class="card"><h2>Mood</h2><select id="moodWho"></select><select id="moodVal"><option>Happy</option><option>Calm</option><option>Okay</option><option>Excited</option><option>Sad</option><option>Angry</option><option>Anxious</option><option>Tired</option><option>Overwhelmed</option></select><button class="primary" id="saveMood">Save Mood</button><div id="moodHistory"></div></div></section><section id="journal" class="page"><div class="card"><h2>Private Journal</h2><select id="journalWho"><option value="">System</option></select><textarea id="journalText" rows="9" placeholder="Write a journal entry..."></textarea><button class="primary" id="saveJournal">Save Entry</button><div id="journalHistory"></div></div></section><section id="settings" class="page"><div class="card"><h2>Settings & Backup</h2><button class="primary" id="export">Export JSON Backup</button><button class="secondary" id="import">Import JSON Backup</button><input id="file" type="file" accept="application/json" hidden><p class="small">All tracker data is stored locally on this device.</p></div><div class="card"><h3>Groups</h3><input id="groupName" placeholder="New group name"><button class="primary" id="addGroup">Add Group</button><div id="groups"></div></div></section></main><script>(function(){'use strict';var KEY='eigtba-v4';var d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}if(!d)d={alters:[],fronting:[],moods:[],journals:[],quick:'',groups:[],relationships:[],timelines:[]};d.groups=d.groups||[];d.relationships=d.relationships||[];d.timelines=d.timelines||[];function $(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function nameOf(id){var a=d.alters.find(function(x){return String(x.id)===String(id)});return a?a.name:'Unknown'}function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}function go(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-page')===id)})}document.querySelectorAll('#nav button').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-page'));render()})});document.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-go'));render()})});$('addAlter').addEventListener('click',function(){var n=$('aname').value.trim();if(!n){alert('Please enter an alter name.');return}d.alters.push({id:String(Date.now()),name:n,pronouns:$('apr').value.trim(),img:$('aimg').value.trim(),bg:$('abg').value.trim(),shape:$('ashape').value,color:$('acolor').value,status:$('astatus').value,bio:$('abio').value,song:$('asong').value,group:$('agroup').value.trim(),private:$('aprivate').checked});['aname','apr','aimg','abg','abio','asong','agroup'].forEach(function(x){$(x).value=''});$('aprivate').checked=false;save()});$('search').addEventListener('input',renderAlters);$('setFront').addEventListener('click',function(){if(!$('frontSelect').value){alert('Add an alter first.');return}d.fronting.push({who:$('frontSelect').value,state:$('frontState').value,at:Date.now()});save()});$('saveMood').addEventListener('click',function(){if(!$('moodWho').value){alert('Add an alter first.');return}d.moods.push({who:$('moodWho').value,mood:$('moodVal').value,at:Date.now()});save()});$('saveJournal').addEventListener('click',function(){var t=$('journalText').value.trim();if(!t)return;d.journals.push({who:$('journalWho').value,text:t,at:Date.now()});$('journalText').value='';save()});$('saveQuick').addEventListener('click',function(){d.quick=$('quick').value;save();alert('Note saved.')});$('addGroup').addEventListener('click',function(){var n=$('groupName').value.trim();if(!n)return;d.groups.push({id:String(Date.now()),name:n});$('groupName').value='';save()});$('export').addEventListener('click',function(){var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eigtba-backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000)});$('import').addEventListener('click',function(){$('file').click()});$('file').addEventListener('change',function(){var f=$('file').files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!Array.isArray(x.alters))throw 1;d=x;save();alert('Backup restored.')}catch(e){alert('Invalid backup file.')}};r.readAsText(f)});function renderAlters(){var q=$('search').value.toLowerCase(),html='';d.alters.forEach(function(a){if((a.name+' '+(a.pronouns||'')+' '+(a.group||'')).toLowerCase().indexOf(q)<0)return;html+='<div class="card alter" style="border-left:5px solid '+esc(a.color||'#e86f92')+'"><img class="avatar '+esc(a.shape||'circle')+'" src="'+esc(a.img||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="info"><b>'+esc(a.name)+'</b><div class="small">'+esc(a.pronouns||'')+' · '+esc(a.status||'Active')+(a.group?' · '+esc(a.group):'')+'</div>'+esc(a.bio||'')+(a.song?'<audio controls preload="none" src="'+esc(a.song)+'" onplay="this.playbackRate=1"></audio>':'')+'<div class="row"><button class="secondary edit" data-id="'+a.id+'">Open Profile</button><button class="danger delete" data-id="'+a.id+'">Delete</button></div></div></div>'});$('alterList').innerHTML=html||'<p class="small">No alters yet.</p>';document.querySelectorAll('.delete').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-id');if(confirm('Delete this alter?')){d.alters=d.alters.filter(function(a){return String(a.id)!==String(id)});d.fronting=d.fronting.filter(function(x){return String(x.who)!==String(id)});save()}})});document.querySelectorAll('.edit').forEach(function(b){b.addEventListener('click',function(){openProfile(b.getAttribute('data-id'))})})}function openProfile(id){var a=d.alters.find(function(x){return String(x.id)===String(id)});if(!a)return;go('profile');var rel=d.relationships.filter(function(r){return String(r.a)===String(id)||String(r.b)===String(id)});var tl=d.timelines.filter(function(t){return String(t.who)===String(id)}).slice().reverse();var total=0;for(var i=0;i<d.fronting.length;i++)if(String(d.fronting[i].who)===String(id)){var next=d.fronting[i+1],end=next?next.at:Date.now();total+=Math.max(0,end-d.fronting[i].at)}var hrs=Math.floor(total/3600000),mins=Math.floor(total%3600000/60000);$('profileContent').innerHTML='<div class="profileHero" style="background-image:linear-gradient(#ffffffbb,#ffffffbb),url(\''+esc(a.bg||'')+'\')"><img class="profileAvatar '+esc(a.shape||'circle')+'" src="'+esc(a.img||'')+'" onerror="this.style.visibility=\'hidden\'"><h2>'+esc(a.name)+'</h2><div>'+esc(a.pronouns||'')+' · '+esc(a.status||'Active')+'</div></div><div class="card"><p>'+esc(a.bio||'No bio yet.')+'</p><span class="tag">Front time: '+hrs+'h '+mins+'m</span><span class="tag">'+esc(a.group||'No group')+'</span>'+ (a.private?'<span class="tag">Private</span>':'')+(a.song?'<audio controls src="'+esc(a.song)+'" onplay="this.playbackRate=1"></audio>':'')+'<div class="row"><button class="secondary" id="backAlters">Back</button><button class="primary" id="editProfile">Edit</button></div></div><div class="card"><h3>Relationships</h3>'+ (rel.map(function(r){var other=String(r.a)===String(id)?r.b:r.a;return'<div class="item"><b>'+esc(nameOf(other))+'</b> · '+esc(r.type||'Relationship')+'</div>'}).join('')||'<p class="small">No relationships yet.</p>')+'<select id="relOther">'+d.alters.filter(function(x){return String(x.id)!==String(id)}).map(function(x){return'<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('')+'</select><input id="relType" placeholder="Relationship type"><button class="primary" id="addRel">Add Relationship</button></div><div class="card"><h3>Timeline</h3><textarea id="timelineText" placeholder="Add a timeline event..."></textarea><button class="primary" id="addTimeline">Add Event</button>'+ (tl.map(function(t){return'<div class="item"><div class="small">'+new Date(t.at).toLocaleString()+'</div>'+esc(t.text)+'</div>'}).join('')||'<p class="small">No timeline events yet.</p>')+'</div>';$('backAlters').addEventListener('click',function(){go('alters');render()});$('editProfile').addEventListener('click',function(){editAlter(id)});$('addRel').addEventListener('click',function(){if(!$('relOther').value)return;d.relationships.push({a:id,b:$('relOther').value,type:$('relType').value.trim()||'Relationship'});openProfile(id)});$('addTimeline').addEventListener('click',function(){var t=$('timelineText').value.trim();if(!t)return;d.timelines.push({who:id,text:t,at:Date.now()});openProfile(id)})}function editAlter(id){var a=d.alters.find(function(x){return String(x.id)===String(id)});if(!a)return;go('alters');var e=$('editor');e.innerHTML='<div class="card"><h3>Edit '+esc(a.name)+'</h3><input id="en" value="'+esc(a.name)+'"><input id="ep" value="'+esc(a.pronouns||'')+'"><input id="ei" value="'+esc(a.img||'')+'"><input id="eb" value="'+esc(a.bg||'')+'"><select id="es"><option>circle</option><option>square</option><option>diamond</option></select><input id="ec" type="color" value="'+esc(a.color||'#e86f92')+'"><select id="est"><option>Active</option><option>Inactive</option><option>Dormant</option></select><textarea id="ebio">'+esc(a.bio||'')+'</textarea><input id="eso" value="'+esc(a.song||'')+'"><input id="eg" value="'+esc(a.group||'')+'"><label><input id="epriv" type="checkbox" style="width:auto"> Private profile</label><div class="row"><button class="primary" id="saveEdit">Save Changes</button><button class="secondary" id="cancelEdit">Cancel</button></div></div>';$('es').value=a.shape||'circle';$('est').value=a.status||'Active';$('epriv').checked=!!a.private;$('saveEdit').addEventListener('click',function(){Object.assign(a,{name:$('en').value.trim()||a.name,pronouns:$('ep').value,img:$('ei').value,bg:$('eb').value,shape:$('es').value,color:$('ec').value,status:$('est').value,bio:$('ebio').value,song:$('eso').value,group:$('eg').value,private:$('epriv').checked});e.innerHTML='';save()});$('cancelEdit').addEventListener('click',function(){e.innerHTML=''})}function render(){renderAlters();var o=d.alters.map(function(a){return'<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>'}).join('');$('frontSelect').innerHTML=o||'<option value="">No alters</option>';$('moodWho').innerHTML=o||'<option value="">No alters</option>';$('journalWho').innerHTML='<option value="">System</option>'+o;var cur=d.fronting.length?d.fronting[d.fronting.length-1]:null;$('homeFront').textContent=cur?nameOf(cur.who)+' · '+cur.state:'No one selected';$('frontNow').innerHTML=cur?'<b>'+esc(nameOf(cur.who))+'</b> · '+esc(cur.state)+'<div class="small">Since '+new Date(cur.at).toLocaleString()+'</div>':'<span class="small">Nobody is marked.</span>';$('frontHistory').innerHTML=d.fronting.slice().reverse().map(function(x){return'<div class="history"><b>'+esc(nameOf(x.who))+'</b> · '+esc(x.state)+'<div class="small">'+new Date(x.at).toLocaleString()+'</div></div>'}).join('')||'<p class="small">No history yet.</p>';$('moodHistory').innerHTML=d.moods.slice().reverse().map(function(x){return'<div class="history"><b>'+esc(nameOf(x.who))+'</b> · '+esc(x.mood)+'<div class="small">'+new Date(x.at).toLocaleString()+'</div></div>'}).join('')||'<p class="small">No moods yet.</p>';$('journalHistory').innerHTML=d.journals.slice().reverse().map(function(x){return'<div class="card"><div class="small">'+new Date(x.at).toLocaleString()+(x.who?' · '+esc(nameOf(x.who)):' · System')+'</div>'+esc(x.text).replace(/\n/g,'<br>')+'</div>'}).join('')||'<p class="small">No entries yet.</p>';$('groups').innerHTML=d.groups.map(function(g){return'<div class="item"><b>'+esc(g.name)+'</b></div>'}).join('')||'<p class="small">No groups yet.</p>';$('quick').value=d.quick||''}render()})();</script></body></html>

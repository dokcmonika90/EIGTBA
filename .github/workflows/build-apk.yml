name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Everything-Is-Going-To-Be-Alright.apk

      # Keeps a normal Actions artifact as a backup.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Everything-Is-Going-To-Be-Alright-debug-apk
          path: Everything-Is-Going-To-Be-Alright.apk
          if-no-files-found: error
          retention-days: 90

      # Also puts the APK directly on the GitHub Releases page,
      # which is much easier to download from an Android phone.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Everything Is Going To Be Alright APK ${{ github.run_number }}
          body: |
            Android APK build ${{ github.run_number }}.

            Download **Everything-Is-Going-To-Be-Alright.apk** below and install it on Android.
          files: Everything-Is-Going-To-Be-Alright.apk
          generate_release_notes: false

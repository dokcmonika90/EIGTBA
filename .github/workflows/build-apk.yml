name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify app files
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/dashboard-mood.js
          test -s app/src/main/assets/groups-upgrade.js
          test -s app/src/main/assets/relationships-upgrade.js
          test -s app/src/main/assets/relationships-manager.js
      - name: Inject feature scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('dashboard-mood.js','groups-upgrade.js','relationships-upgrade.js','relationships-manager.js'):
              tag=f'<script src="{name}"></script>'
              if tag not in s: s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Everything-Is-Going-To-Be-Alright.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Everything-Is-Going-To-Be-Alright-debug-apk
          path: Everything-Is-Going-To-Be-Alright.apk
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Everything Is Going To Be Alright APK ${{ github.run_number }}
          body: Android APK build ${{ github.run_number }}.
          files: Everything-Is-Going-To-Be-Alright.apk
          generate_release_notes: false
